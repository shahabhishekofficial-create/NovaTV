name: Android TV verification

on:
  push:
    paths:
      - 'app/**'
      - 'tools/generate-test-media.sh'
      - '.github/workflows/tv-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tv-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        profile: [tv_720p, tv_1080p]
    env:
      TV_PROFILE: ${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install FFmpeg for synthetic streams
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Generate temporary test streams
        run: tools/generate-test-media.sh /tmp/novatv-media
      - name: Build app and instrumentation tests
        run: ./gradlew testDebugUnitTest assembleDebug assembleDebugAndroidTest assembleRelease
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Verify Android TV at ${{ matrix.profile }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: ${{ matrix.profile }}
          ram-size: 3072M
          heap-size: 512M
          cores: 2
          script: |
            set -eu
            mkdir -p evidence
            python3 -m http.server 8766 --directory /tmp/novatv-media > /tmp/novatv-media-server.log 2>&1 &
            server=$!
            trap 'kill "$server" 2>/dev/null || true; adb logcat -d -t 2500 > evidence/logcat.txt || true; adb exec-out screencap -p > evidence/final-screen.png || true; adb pull /sdcard/Android/data/tv.nova.player.debug/files/test-evidence/ evidence/ || true; cp /tmp/novatv-media-server.log evidence/ || true' EXIT
            adb wait-for-device
            adb shell input keyevent 82
            curl --fail --retry 20 --retry-delay 1 http://127.0.0.1:8766/video.m3u8 > /dev/null
            ./gradlew connectedDebugAndroidTest --stacktrace
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n tv.nova.player/.ui.HomeActivity
            sleep 5
            adb shell pidof tv.nova.player | grep -E '[0-9]+'
            adb shell dumpsys activity top | grep 'tv.nova.player'
            adb exec-out screencap -p > "evidence/release-home-${TV_PROFILE}.png"
      - name: Collect instrumentation reports
        if: always()
        run: |
          mkdir -p evidence/test-results evidence/test-report
          cp -r app/build/outputs/androidTest-results/connected/* evidence/test-results/ 2>/dev/null || true
          cp -r app/build/reports/androidTests/connected/* evidence/test-report/ 2>/dev/null || true
          python3 - <<'PY'
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          def escape(value):
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          rows = []
          for report in sorted(pathlib.Path('evidence/test-results').rglob('*.xml')):
              try:
                  suite = ET.parse(report).getroot()
              except ET.ParseError:
                  continue
              for case in suite.iter('testcase'):
                  name = f"{case.get('classname', '')}.{case.get('name', '')}"
                  failure = case.find('failure')
                  if failure is None:
                      rows.append(f"| PASS | `{name}` |")
                  else:
                      message = failure.get('message') or (failure.text or 'Instrumentation failure')
                      rows.append(f"| FAIL | `{name}` |")
                      print(f"::error title={escape(name)}::{escape(message[:8000])}")
          if rows:
              summary = pathlib.Path(os.environ['GITHUB_STEP_SUMMARY'])
              with summary.open('a') as output:
                  output.write(f"## {os.environ.get('TV_PROFILE', 'TV')} instrumentation\n\n")
                  output.write('| Result | Test |\n| --- | --- |\n' + '\n'.join(rows) + '\n')
          PY
      - name: Upload TV verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novatv-tv-verification-${{ matrix.profile }}
          path: evidence/
          if-no-files-found: warn
