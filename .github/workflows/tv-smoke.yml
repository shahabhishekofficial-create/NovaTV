name: Android TV emulator smoke

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/tv-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tv-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: ./gradlew assembleRelease
      - name: Install and launch on Android TV
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          ram-size: 2048M
          heap-size: 512M
          script: |
            set -euo pipefail
            trap 'adb logcat -d -t 400 > novatv-logcat.txt || true' EXIT
            adb wait-for-device
            adb shell input keyevent 82
            adb install -r app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n tv.nova.player/.ui.HomeActivity
            sleep 12
            adb shell pidof tv.nova.player | grep -E '[0-9]+'
            adb shell dumpsys activity top | grep 'tv.nova.player'
            adb exec-out screencap -p > novatv-tv-smoke.png
      - name: Upload TV smoke evidence
        uses: actions/upload-artifact@v4
        with:
          name: novatv-tv-smoke
          path: |
            novatv-tv-smoke.png
            novatv-logcat.txt
          if-no-files-found: warn
